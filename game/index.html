<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>SOLMAR — Sun, Sand &amp; Sirens</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1018; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* The minimap lives in the top-left corner, over the game canvas. */
  #minimap { position: fixed; top: 12px; left: 12px; width: 200px; height: 140px; display: block; pointer-events: none; border: 1px solid rgba(255,255,255,0.35); border-radius: 6px; background: #22301e; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar: an open-world crime game. Drive, steal cars, run missions and lose the police."></canvas>
<canvas id="minimap" width="200" height="140" aria-hidden="true"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
